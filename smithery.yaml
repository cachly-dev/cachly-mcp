name: cachly AI Brain
version: 0.10.200
description: >
  Solve it once. From then on, your AI knows. Experience for coding agents,
  EU-hosted: Claude Code, Cursor, Copilot, Windsurf, Cline & Zed.
  Its tools include causal root-cause analysis (causal_trace), failure
  prediction (brain_predict), learning from git history (brain_from_git) and a
  Team Brain, with search in 11 languages.
  No sign-up needed: the first tool call creates a test Brain on EU servers.
  Own account: npx @cachly-dev/mcp-server@latest claim.

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      CACHLY_JWT:
        type: string
        title: "API Key (optional — without it, a test Brain is created on first use)"
        description: "Leave blank for zero-config: on your first tool call the server creates a test Brain on EU servers, no sign-up. Or pre-fill with your API key from cachly.dev/setup-ai."
        examples:
          - "cky_live_abc123..."
      CACHLY_BRAIN_INSTANCE_ID:
        type: string
        title: "Brain Instance ID (optional)"
        description: "Only needed if you have multiple Brain instances. Leave blank — the server auto-detects your active instance from the API key."
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        examples:
          - "9d4077aa-bfa2-468b-89cd-0a8d8f3ec483"
      CACHLY_API_URL:
        type: string
        title: "API URL (optional)"
        description: "Leave blank unless you self-host Cachly."
        default: "https://api.cachly.dev"
    required: []
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@cachly-dev/mcp-server@latest"],
      env: Object.fromEntries(
        Object.entries({
          CACHLY_JWT: config.CACHLY_JWT,
          CACHLY_BRAIN_INSTANCE_ID: config.CACHLY_BRAIN_INSTANCE_ID,
          CACHLY_API_URL: config.CACHLY_API_URL ?? "https://api.cachly.dev",
        }).filter(([, v]) => v != null && v !== "")
      )
    })
