# brain-from-ci-action.yml
#
# Copy-paste this into .github/workflows/ to automatically push CI outcomes
# to your cachly Brain so it can self-calibrate prediction confidence.
#
# Required repository secrets:
#   CACHLY_JWT                – your Keycloak access token
#   CACHLY_BRAIN_INSTANCE_ID  – your Brain instance UUID (from cachly dashboard)
#
# Optional:
#   CACHLY_API_URL            – override API base (default: https://api.cachly.dev)

name: cachly Brain — CI Outcome Push

on:
  workflow_run:
    # ⚠️  GitHub Actions does NOT support wildcards here — list your workflow
    # names explicitly, or use the broad pattern below and add more as needed.
    # Common names to include: "CI", "Test", "Build", "Deploy", "Lint"
    workflows:
      - "CI"
      - "Test"
      - "Build"
      - "Deploy"
      - "Lint"
      # Add more workflow names from your .github/workflows/ here
    types: [completed]

jobs:
  push-ci-outcome:
    name: Push CI outcome to cachly Brain
    runs-on: ubuntu-latest
    # No secrets-guard needed here: the `secrets` context is not available in
    # job-level `if` expressions. push-ci-outcome.mjs exits 0 cleanly when
    # CACHLY_JWT / CACHLY_BRAIN_INSTANCE_ID are missing (e.g. on forks).
    steps:
      - name: Checkout ci-integration helper
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            sdk/mcp/src/ci-integration/push-ci-outcome.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Push outcome to cachly Brain
        env:
          CACHLY_JWT: ${{ secrets.CACHLY_JWT }}
          CACHLY_BRAIN_INSTANCE_ID: ${{ secrets.CACHLY_BRAIN_INSTANCE_ID }}
          CACHLY_API_URL: ${{ vars.CACHLY_API_URL || 'https://api.cachly.dev' }}
          # Map GitHub Actions conclusion → JOB_STATUS
          # conclusion: success | failure | cancelled | skipped | timed_out | action_required
          JOB_NAME: ${{ github.event.workflow_run.name }}
          JOB_STATUS: ${{ github.event.workflow_run.conclusion }}
          # Previous conclusion lets the Brain know if its prediction was right.
          # run_attempt > 1 means an earlier attempt of this run failed.
          PREV_STATUS: ${{ github.event.workflow_run.run_attempt > 1 && 'failure' || '' }}
        run: node sdk/mcp/src/ci-integration/push-ci-outcome.mjs
