services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tco
      POSTGRES_PASSWORD: tco
      POSTGRES_DB: tco
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./backend/app/db/migrations/002_telemetry_freemium.sql:/docker-entrypoint-initdb.d/002_telemetry_freemium.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tco"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ../..
      dockerfile: apps/travel-chaos-organizer/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tco:tco@postgres:5432/tco
      KEYCLOAK_URL: http://keycloak:8080
      # Local Redis acts as Cachly cache in dev — replace with your Cachly URL in production
      CACHLY_REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "127.0.0.1:8000:8000"   # internal only; Caddy proxies 80/443
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  telegram-bot:
    build: ./telegram-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - TCO_API_URL=http://backend:8000
      - TCO_BOT_SECRET=${TELEGRAM_BOT_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - telegram

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      TCO_DOMAIN: ${TCO_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: tco
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - backup

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
