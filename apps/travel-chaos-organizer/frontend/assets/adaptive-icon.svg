<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="glow" cx="50%" cy="43%" r="27%" fx="50%" fy="43%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <filter id="planeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Radial glow behind plane -->
  <ellipse cx="512" cy="440" rx="300" ry="280" fill="url(#glow)"/>

  <!-- Paper plane group, centered ~(512, 420) -->
  <g filter="url(#planeShadow)">
    <!-- Main wing body -->
    <polygon
      points="192,540 512,270 832,420 512,480"
      fill="#ffffff"
      opacity="0.97"
    />
    <!-- Lower wing / tail -->
    <polygon
      points="192,540 512,480 400,620"
      fill="#c7c4f0"
      opacity="0.85"
    />
    <!-- Nose crease highlight -->
    <polygon
      points="512,270 832,420 512,380"
      fill="#e8e6ff"
      opacity="0.6"
    />
    <!-- Tail fold accent -->
    <polygon
      points="400,620 512,480 512,560"
      fill="#9d9ae8"
      opacity="0.7"
    />
  </g>

  <!-- TCO text -->
  <text
    x="512"
    y="692"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="140"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="12"
  >TCO</text>

  <!-- Subtitle text -->
  <text
    x="512"
    y="778"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="52"
    font-weight="400"
    fill="#6666aa"
    text-anchor="middle"
    letter-spacing="3"
  >Travel Chaos Organizer</text>
</svg>
