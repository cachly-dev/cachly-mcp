name: EAS Build — TCO Android Preview

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Build reason'
        default: 'manual build'

jobs:
  build:
    name: Build Android preview APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/travel-chaos-organizer/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Convert SVG icons to PNG (EAS Build requires PNG)
        run: |
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon.svg        -o assets/icon.png
          rsvg-convert -w 1024 -h 1024 assets/adaptive-icon.svg -o assets/adaptive-icon.png
          rsvg-convert -w 2048 -h 2048 assets/splash.svg        -o assets/splash.png
          echo "Icons converted:"
          ls -lh assets/*.png

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Create .env with production variables
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}" >> .env
          echo "EXPO_PUBLIC_KEYCLOAK_URL=${{ secrets.EXPO_PUBLIC_KEYCLOAK_URL }}" >> .env
          echo "EXPO_PUBLIC_KEYCLOAK_REALM=${{ secrets.EXPO_PUBLIC_KEYCLOAK_REALM || 'travel-chaos' }}" >> .env
          echo "EXPO_PUBLIC_KEYCLOAK_CLIENT_ID=${{ secrets.EXPO_PUBLIC_KEYCLOAK_CLIENT_ID || 'tco-mobile' }}" >> .env

      - name: Build Android (preview — internal distribution)
        run: |
          eas build \
            --profile preview \
            --platform android \
            --non-interactive \
            --no-wait
        # --no-wait: EAS build runs in the cloud asynchronously.
        # Download the APK from expo.dev → your project → Builds when done (~10-15 min).
