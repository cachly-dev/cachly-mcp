name: EAS Update — TCO Production

on:
  push:
    branches: [main]
    paths:
      - 'apps/travel-chaos-organizer/frontend/**'
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message'
        default: 'OTA update'

jobs:
  update:
    name: Publish EAS Update to production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/travel-chaos-organizer/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create .env with production variables
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}" >> .env
          echo "EXPO_PUBLIC_KEYCLOAK_URL=${{ secrets.EXPO_PUBLIC_KEYCLOAK_URL }}" >> .env
          echo "EXPO_PUBLIC_KEYCLOAK_REALM=${{ secrets.EXPO_PUBLIC_KEYCLOAK_REALM || 'travel-chaos' }}" >> .env
          echo "EXPO_PUBLIC_KEYCLOAK_CLIENT_ID=${{ secrets.EXPO_PUBLIC_KEYCLOAK_CLIENT_ID || 'tco-mobile' }}" >> .env

      - name: Publish EAS Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          MESSAGE="${{ github.event.inputs.message || github.event.head_commit.message }}"
          MESSAGE="${MESSAGE:0:100}"
          # Publish to both channels so preview and production builds both get the update
          npx eas-cli update \
            --branch production \
            --message "$MESSAGE" \
            --non-interactive
          npx eas-cli update \
            --branch preview \
            --message "$MESSAGE" \
            --non-interactive
